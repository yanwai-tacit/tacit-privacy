<head>

<title>言外 / Tacit — 隐私政策 / Privacy Policy</title>
<style>
:root { --bg:#fbfbfa; --text:#1f2328; --muted:#5b6470; --line:#e3e5e8; --card:#ffffff; --link:#2f5fb3; --code:#f1f2f4; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#16181b; --text:#e6e8eb; --muted:#9aa3ad; --line:#2b3036; --card:#1d2024; --link:#8ab4f8; --code:#262a2f; } }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin:0; background:var(--bg); color:var(--text); font:16px/1.7 system-ui,-apple-system,'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif; }
main { max-width:720px; margin:0 auto; padding:32px 16px 64px; }
h1 { font-size:1.7rem; line-height:1.3; margin:8px 0 12px; }
h2 { font-size:1.2rem; line-height:1.4; margin:36px 0 8px; padding-top:20px; border-top:1px solid var(--line); }
h3 { font-size:1.02rem; margin:22px 0 6px; }
p { margin:10px 0; }
ul { margin:8px 0 8px; padding-left:1.4em; }
li { margin:6px 0; }
a { color:var(--link); }
code { background:var(--code); padding:1px 5px; border-radius:4px; font:0.92em ui-monospace,SFMono-Regular,Consolas,monospace; word-break:break-all; }
.meta { color:var(--muted); font-size:0.94rem; }
.top { display:flex; justify-content:space-between; gap:12px; font-size:0.94rem; margin-bottom:8px; }
.choices { display:grid; gap:12px; margin-top:28px; }
.choice { display:block; padding:18px 20px; background:var(--card); border:1px solid var(--line); border-radius:12px; text-decoration:none; color:var(--text); }
.choice strong { display:block; font-size:1.1rem; color:var(--link); }
.choice span { color:var(--muted); font-size:0.94rem; }
</style>
</head>

</div>

</body>
</html>
